name: RegRadar CI Gatekeeper

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.hcl'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gatekeeper:
    name: RegRadar Blast-Radius & Invariant Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.11' }}
          cache: 'pip'

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ vars.TOFU_VERSION || '1.8.2' }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install checkov || true

      - name: Generate Speculative OpenTofu Plan
        id: generate_plan
        run: |
          echo "Initializing OpenTofu in stateless verification mode..."
          tofu init -backend=false || true
          echo "Generating plan file..."
          tofu plan -out=tfplan -no-color || true
          tofu show -json tfplan > plan.json 2>/dev/null || echo "{}" > plan.json

      - name: Execute RegRadar PR Gatekeeper
        id: gatekeeper
        run: |
          python -m regradar.integrations.github_action \
            --dir . \
            --plan plan.json \
            --output regradar_pr_comment.md \
            --step-summary

      - name: Publish Gatekeeper Summary to PR Discussion
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commentPath = 'regradar_pr_comment.md';

            if (!fs.existsSync(commentPath)) {
              console.log('No PR comment file found at ' + commentPath);
              return;
            }

            const commentBody = fs.readFileSync(commentPath, 'utf8');
            const identifier = 'RegRadar CI/CD Compliance & Safety Gatekeeper';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(identifier));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
              console.log(`Updated existing PR comment ID: ${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
              console.log('Created new PR comment.');
            }
